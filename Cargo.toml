[package]
name = "navymill"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "navymill-play"
path = "./src/bin/main.rs"

[[bin]]
name = "navymill-simulate"
path = "./src/bin/simulate.rs"

[dependencies]

# Crossbeam utils.
crossbeam-utils = { version = "0.8.21", default-features = false, features = [] }

# Map structure - fast and concurrent.
dashmap = { version = "6.1.0", default-features = false, features = [] }

# Map structure - ordered and concurrent.
crossbeam-skiplist = { version = "0.1.3", default-features = false, features = ["std"] }

# Randomness.
rand = { version = "0.9.2", default-features = false, features = ["thread_rng"] }
